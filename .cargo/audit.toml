# Accepted dependency advisories.
#
# Read this with docs/security/reference/dependency-advisories.md, which records
# the reachability analysis behind every entry. Nothing is listed here without a
# corresponding section there, and nothing is listed here that has a fix
# available - if an upgrade exists, the upgrade is the answer.
#
# The point of this file is that CI fails on a NEW advisory. An empty ignore
# list would mean CI is permanently red and therefore ignored by everyone, which
# is how a scanner stops being a control.
#
# Review date: 2026-12-07. Each entry below states what would let it be removed.

[advisories]
ignore = [
    # rsa 0.9 - Marvin timing sidechannel. No fixed version exists upstream.
    # NOT REACHABLE: the crate is used at one site (crates/duckdb-engine, the
    # Snowflake key-pair auth path) to read a LOCAL private key and derive the
    # public-key SHA-256 fingerprint for the JWT issuer string. There is no RSA
    # decryption anywhere in the tree, and the JWT itself is signed by
    # jsonwebtoken. Marvin requires chosen-ciphertext decryption timing.
    # Remove when: the rsa crate publishes a constant-time release.
    "RUSTSEC-2023-0071",

    # quick-xml 0.40 - denial of service on hostile XML.
    # Duckle's own XML reading is on quick-xml 0.42, which is past the fix. This
    # copy comes only through the optional duckle-lance sidecar, inside
    # lance-namespace-impls' Azure credential vendor, where the XML parsed is
    # Azure's own credential response rather than pipeline input.
    # Remove when: lancedb takes a lance-namespace-impls release on 0.41+.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # crypto-bigint 0.5.5 - timing variability in constant-time operations. The fix
    # is on 0.7.6, and this copy is pinned by jsonwebtoken 11.1.0 through p256 and
    # p384 0.13. NOT REACHABLE: those are the ES256 and ES384 paths, and Duckle signs
    # and verifies RS256 only (Snowflake key-pair auth, and OIDC, which refuses any
    # other algorithm).
    # Remove when: jsonwebtoken moves to p256 and p384 on crypto-bigint 0.7.6+.
    "RUSTSEC-2026-0387",

    # zstd 0.13.3 - a reused context carries an abandoned stream into the next one.
    # The fix is on 0.14.3, and this copy is pinned by parquet, arrow-ipc and rskafka.
    # NOT REACHABLE: the flaw is in the stream `with_context` constructors, and no
    # dependency calls one. Parquet and Arrow use zstd::bulk, the rest build plain
    # streams with Encoder::new and Decoder::new.
    # Remove when: parquet, arrow-ipc and rskafka reach zstd 0.14.3+.
    "RUSTSEC-2026-0391",

    # zstd-safe 7.2.1 - stale heap memory after a failed legacy frame. The fix is on
    # 8.2.0, and this copy is what zstd 0.13.3 requires. NOT REACHABLE: only
    # stream::write::Decoder exposes it, and no dependency uses one. The advisory
    # itself clears stream::read::Decoder and the bulk API, which are what is used.
    # Remove when: zstd 0.13.3 is gone, as above.
    "RUSTSEC-2026-0403",

    # thrift 0.17.0 - unbounded allocation from a length prefix in the binary protocol.
    # The fix is on 0.23.0, and this copy is pinned by parquet 58 in the optional
    # duckle-lance sidecar, which lancedb, lance and vortex hold on arrow 58. The
    # engine's own parquet is 59, which does not use thrift. NOT REACHABLE: the sidecar
    # reads only Parquet files the engine has just written with DuckDB, so every length
    # in a footer it decodes is DuckDB's.
    # Remove when: lancedb, lance and vortex move to arrow 59, or parquet 58 takes thrift 0.23+.
    "RUSTSEC-2026-0435",
]
