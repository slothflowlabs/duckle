[package]
name = "duckle-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Lean, no-GUI headless runner: executes a Duckle pipeline file through the
# DuckDB engine. Bundled into "Build Pipeline" artifacts so a pipeline runs
# standalone on a server (cron / systemd / Task Scheduler), no desktop app.
[[bin]]
name = "duckle-runner"
path = "src/main.rs"

[dependencies]
duckle-duckdb-engine = { workspace = true }
duckle-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
# Web-console scheduler: cron expressions (evaluated in local time) alongside
# the existing interval schedules (issue #132). Already in the workspace lock.
chrono = { workspace = true }
cron = { workspace = true }
aes-gcm = "0.11"
sha2 = "0.11"
# Console account tokens. A token can be chosen by a person, so it is hashed
# as a password rather than as key material. Already in the workspace lock.
argon2 = "0.5"
# Console accounts, sessions and API keys. SQLite rather than a JSON file: the
# stores are read on every request and written concurrently by `serve` and
# `web`, which is what a transactional store is for. rusqlite (bundled) is
# already declared in the workspace and adds no second SQLite to the binary.
rusqlite = { workspace = true }
# The console's HTTP layer. axum 0.7 is already resolved in the lock (pulled
# transitively), so this adds the router and the extractor rather than a new
# dependency tree. `net` is what tokio needs to accept connections.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { workspace = true, features = ["net"] }
base64 = "0.23"
getrandom = "0.4"
ed25519-dalek = "3"
# Self-extracting artifact payload (single-file build output). deflate-only
# (drops aes/zstd/bzip2/lzma/xz); pulls flate2 rust_backend already in the lock.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Teradata (ODBC via odbc-api) is enabled on gnu Linux and Windows, where a
# dynamic libodbc driver manager is available to link and load. It is excluded
# on macOS (awkward cross-arch ODBC link) and on the static musl build of the
# runner: musl has no static libodbc to link against, and Teradata needs a
# dynamic ODBC driver manager at runtime anyway. The engine returns a clear
# "compiled without teradata" error on those targets.
[target.'cfg(all(not(target_os = "macos"), not(target_env = "musl")))'.dependencies]
duckle-duckdb-engine = { workspace = true, features = ["teradata"] }

# On gnu Linux, additionally link unixODBC statically so the per-OS runner
# bundled in the desktop app needs no system libodbc.so.2 at runtime (issue
# #131). The musl runner is excluded above and has no teradata at all.
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
duckle-duckdb-engine = { workspace = true, features = ["teradata-static"] }

[dev-dependencies]
tempfile = "3"
